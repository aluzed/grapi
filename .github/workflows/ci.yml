name: ci

# Disabled: run `make ci` locally instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emdash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-emdash.sh
      - run: ./scripts/check-stories.sh

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: make licenses

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grapi
          POSTGRES_PASSWORD: grapi
          POSTGRES_DB: grapi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRAPI_TEST_PG_DSN: postgres://grapi:grapi@localhost:5432/grapi?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags integration ./...
