    method: POST
    path: /api/tags
    token: full
    body: { data: { name: "retro" } }
    save: { tag: data.documentId }
  - name: create-showcase
    method: POST
    path: /api/showcases
    token: full
    body:
      data:
        title: "Every field"
        slug: "every-field"
        summary: "Line 1\nLine 2"
        body: "# Title"
        content: [{ type: paragraph, children: [{ type: text, text: "Hi" }] }]
