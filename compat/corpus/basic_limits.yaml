fixture: basic
# strapi::body limits: 1mb of JSON by default.
cases:
  - name: json-under-limit
    method: POST
    path: /api/tags
    token: full
    body: { data: { name: "limit-ok" } }
    pad: 1000000
  - name: json-over-limit
    method: POST
    path: /api/tags
    token: full
    body: { data: { name: "limit-ko" } }
    pad: 1048600
  - name: json-over-limit-public
    method: POST
    path: /api/tags
    body: { data: { name: "limit-ko" } }
    pad: 1048600
  # formidable's maxFileSize, lowered to 2000 bytes for this fixture
  # (compat.json): the file data over it is refused while it streams in.
  - name: upload-under-max-file-size
    method: POST
    path: /api/upload
    token: full
    files: [{ name: "small.png", width: 4, height: 4 }]
  - name: upload-over-max-file-size
    method: POST
    path: /api/upload
    token: full
    files: [{ name: "big.png", width: 1000, height: 1000 }]
  - name: upload-files-after-limit
    path: /api/upload/files
    token: full
