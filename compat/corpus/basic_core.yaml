fixture: basic
# Validation at publish time, unique, defaults, DELETE, pagination and
# populate edge cases.
cases:
  # A draft skips the required rules; publishing applies them.
  - { name: draft-without-required, method: POST, path: /api/articles, token: full, query: "status=draft", body: { data: { summary: "no title yet" } }, save: { d1: data.documentId } }
  - { name: publish-without-required, method: PUT, path: "/api/articles/{{d1}}", token: full, body: { data: { summary: "still no title" } } }
  - { name: draft-over-max-length, method: POST, path: /api/articles, token: full, query: "status=draft", body: { data: { title: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" } } }
  - { name: draft-bad-regex, method: POST, path: /api/articles, token: full, query: "status=draft", body: { data: { title: "Regex", code: "nope" } } }
  - { name: publish-bad-regex, method: POST, path: /api/articles, token: full, body: { data: { title: "Regex", code: "nope" } } }
  # unique: a second published value fails.
  - { name: unique-first, method: POST, path: /api/articles, token: full, body: { data: { title: "Unique one", code: "UNQ-001" } }, save: { u1: data.documentId } }
  - { name: unique-second-published, method: POST, path: /api/articles, token: full, body: { data: { title: "Unique two", code: "UNQ-001" } } }
  - { name: unique-second-draft, method: POST, path: /api/articles, token: full, query: "status=draft", body: { data: { title: "Unique draft", code: "UNQ-001" } } }
  # default: on create only.
  - { name: default-on-create, method: POST, path: /api/articles, token: full, query: "fields[0]=views&fields[1]=featured&fields[2]=stage", body: { data: { title: "Defaults" } }, save: { df: data.documentId } }
  - { name: no-default-on-update, method: PUT, path: "/api/articles/{{df}}", token: full, query: "fields[0]=views&fields[1]=featured&fields[2]=stage", body: { data: { views: null, stage: null } } }
  - { name: after-update-read, method: GET, path: "/api/articles/{{df}}", token: full, query: "fields[0]=views&fields[1]=featured&fields[2]=stage" }
  # DELETE answers.
  - { name: delete-article, method: DELETE, path: "/api/articles/{{u1}}", token: full }
  - { name: delete-again, method: DELETE, path: "/api/articles/{{u1}}", token: full }
  - { name: delete-tag-missing, method: DELETE, path: /api/tags/nope, token: full }
  # Pagination mixes and bounds.
  - { name: pagination-page-and-limit, path: /api/articles, token: full, query: "pagination[page]=1&pagination[limit]=5" }
  - { name: pagination-start-and-pagesize, path: /api/articles, token: full, query: "pagination[start]=0&pagination[pageSize]=5" }
  - { name: pagination-negative-page, path: /api/articles, token: full, query: "pagination[page]=-1&fields[0]=title" }
  - { name: pagination-zero-pagesize, path: /api/articles, token: full, query: "pagination[pageSize]=0&fields[0]=title" }
  - { name: pagination-string-page, path: /api/articles, token: full, query: "pagination[page]=abc" }
  - { name: pagination-start-limit, path: /api/articles, token: full, query: "pagination[start]=1&pagination[limit]=1&fields[0]=title&sort=id:asc" }
  # populate=* variants.
  - { name: populate-star, path: /api/articles, token: full, query: "populate=*&fields[0]=title&pagination[pageSize]=1&sort=id:asc" }
  - { name: populate-star-array, path: /api/articles, token: full, query: "populate[0]=*&fields[0]=title&pagination[pageSize]=1&sort=id:asc" }
  - { name: populate-unknown, path: /api/articles, token: full, query: "populate=nope" }
  - { name: populate-nested-star, path: /api/articles, token: full, query: "populate[title][populate]=*" }
