cases:
  - { name: pages-all, uid: api::page.page, params: { orderBy: [{ id: asc }] } }
  - { name: by-seo-title, uid: api::page.page, params: { where: { seo: { metaTitle: { $containsi: "page" } } } } }
  - { name: by-seo-bool, uid: api::page.page, params: { where: { seo: { noIndex: true } } } }
  - { name: by-seo-null, uid: api::page.page, params: { where: { seo: { $null: true } }, orderBy: [{ id: asc }] } }
  - { name: by-link-label, uid: api::page.page, params: { where: { links: { label: { $in: ["Docs", "Contact"] } } }, orderBy: [{ id: asc }] } }
  - { name: by-link-author, uid: api::page.page, params: { where: { links: { author: { name: "bob" } } } } }
  - { name: by-nested-column-width, uid: api::page.page, params: { where: { layout: { columns: { width: { $gte: 12 } } } } } }
  - { name: by-nested-cell-authors, uid: api::page.page, params: { where: { layout: { columns: { cell: { authors: { name: "Ana" } } } } } } }
  - { name: count-by-links, uid: api::page.page, op: count, params: { where: { links: { url: { $startsWith: "/" } } } } }
  - { name: sort-by-seo-title, uid: api::page.page, params: { orderBy: [{ seo: { metaTitle: asc } }] } }
  - { name: sort-by-seo-title-desc, uid: api::page.page, params: { orderBy: [{ seo: { metaTitle: desc } }, { id: asc }] } }
  - { name: sort-by-links-label, uid: api::page.page, params: { orderBy: [{ links: { label: asc } }] } }
  - { name: seo-components-direct, uid: shared.seo, params: { where: { metaTitle: { $notNull: true } }, orderBy: [{ id: asc }] } }
  - { name: links-by-author, uid: shared.link, params: { where: { author: { name: { $eqi: "ANA" } } } } }
  - { name: error-filter-dynamic-zone, uid: api::page.page, params: { where: { body: { id: 1 } } } }
  - { name: error-sort-dynamic-zone, uid: api::page.page, params: { orderBy: [{ body: asc }] } }
  - { name: populate-components, uid: api::page.page, params: { populate: ["seo", "links", "layout"], orderBy: [{ id: asc }] } }
  - { name: populate-components-deep, uid: api::page.page, params: { populate: { layout: { populate: { columns: { populate: { cell: { populate: ["authors"] } } } } }, links: { populate: ["author"] } }, orderBy: [{ id: asc }] } }
  - { name: populate-components-count, uid: api::page.page, params: { populate: { links: { count: true } }, orderBy: [{ id: asc }] } }
  - { name: populate-dz-empty, uid: api::page.page, params: { populate: ["body"], orderBy: [{ id: asc }] } }
