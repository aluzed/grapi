users-permissions:
  config:
    jwtSecret: compat-users-jwt-secret
    # remote.sh sets it from the fixture's compat.json (upConfig.jwtManagement).
    jwtManagement: ${env:UP_JWT_MANAGEMENT:legacy-support}
    sessions:
      cookie:
        # Strapi runs in production in the bench: its default is Secure,
        # which koa refuses over plain HTTP. The fixture says false.
        secure: ${env.bool:UP_COOKIE_SECURE:false}
graphql:
  enabled: true
